name: CI

on:
  push:
  pull_request:
  # Allow running the live integration job on demand...
  workflow_dispatch:
  schedule:
    # ...and automatically the day after Patch Tuesday (2nd Tuesday), i.e. the
    # 2nd Wednesday of each month, at 16:00 UTC.
    - cron: '0 16 8-14 * 3'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 pytest flake8
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      # Unit tests only; live integration tests are excluded via pytest.ini.
      run: pytest

  # Live tests against the real MSRC API. Kept off the PR critical path: only
  # runs on manual dispatch or the post-Patch-Tuesday schedule.
  integration:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 pytest flake8
    - name: Run integration tests
      run: pytest -m integration -v
